{# A vendor search box: type to see matching vendors, pick one. The chosen id travels in a hidden field. #}
{% macro vendor_picker(field, label, chosen_id, chosen_name, required=false, empty="Type a vendor name", search=false) -%}
<div class="picker" data-picker>
  <label for="{{ field }}_text">{{ label }}</label>
  <input id="{{ field }}_text" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="{{ field }}_list"
         autocomplete="off" maxlength="100" placeholder="{{ empty }}" value="{{ chosen_name }}" {{ "required" if required }}{{ " data-search" if search }}>
  <input type="hidden" id="{{ field }}" name="{{ field }}" value="{{ chosen_id or '' }}">
  <ul id="{{ field }}_list" class="picker-list" role="listbox" hidden></ul>
</div>
{%- endmacro %}
