{% extends "base.html" %}
{% block content %}
<h1>PO Dashboard</h1>
<div class="strip" role="status" aria-label="Health">
  <span>App: <strong class="ok">ok</strong></span>
  <span>Last scan: {{ health.last_scan }}</span>
  <span>Model {{ health.model_name }}:
    <strong class="{{ 'ok' if health.model == 'reachable' else 'bad' }}">{{ health.model }}</strong></span>
  <span>v{{ version }}</span>
</div>
<p>No purchase orders yet.</p>
{% endblock %}
