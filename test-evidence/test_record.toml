[[case]]
id = "TC-CO-10"
area = "Customer orders"
title = "A QuickBooks sales export is read by a configurable column mapping, and nothing is invented"
priority = "High"
kind = "automated"
refs = ["PD-8.3", "DEC-58", "REQ-CO-06", "REQ-CO-08"]
steps = ["Covered by the tests named."]
expected = "Columns are found by name below title rows and a leading empty column; the order does not matter. A customer comes from a column or a heading row; total rows and headings are recognised; every row is accounted for. Amounts are read as QuickBooks writes them, exactly. Credit memos are told from invoices and payments are not sales documents. Freight, tax, discount and other charges are lines of their own kind, never goods, and the charge names are a setting. A row that cannot be read is listed and marks its invoice for review. A whole invoice or a row listed twice is counted once and noted; two different invoices with one number are a conflict. Formulas stay text; Excel reads like CSV. A file that is not a sales export, a missing required column and a bad mapping are each refused in plain words."
tests = ["test_sales_import.py::test_the_columns_are_found_by_name_below_title_rows_and_a_leading_empty_column", "test_sales_import.py::test_the_order_of_columns_does_not_matter_and_names_are_compared_loosely", "test_sales_import.py::test_a_file_that_is_not_a_sales_export_is_refused_in_plain_words", "test_sales_import.py::test_a_required_column_that_is_not_set_is_named", "test_sales_import.py::test_a_mapping_chosen_in_the_preview_is_checked_against_the_file", "test_sales_import.py::test_a_saved_mapping_is_a_setting_that_suits_only_a_file_that_has_its_columns", "test_sales_import.py::test_headings_totals_and_the_title_are_recognised_and_every_row_is_accounted_for", "test_sales_import.py::test_a_customer_comes_from_the_heading_row_when_there_is_no_name_column", "test_sales_import.py::test_a_row_with_no_customer_at_all_is_not_read_and_says_why", "test_sales_import.py::test_amounts_are_read_as_quickbooks_writes_them_and_exactly", "test_sales_import.py::test_a_row_that_cannot_be_read_is_listed_and_the_invoice_it_touches_is_marked_for_review", "test_sales_import.py::test_credit_memos_are_told_from_invoices_and_payments_are_not_sales_documents", "test_sales_import.py::test_charges_discounts_and_tax_are_lines_of_their_own_kind_and_never_goods", "test_sales_import.py::test_a_line_with_an_amount_and_no_item_or_quantity_waits_for_a_person", "test_sales_import.py::test_the_charge_names_are_a_setting", "test_sales_import.py::test_the_currency_is_a_column_or_the_default_and_a_bad_one_is_not_read", "test_sales_import.py::test_several_po_references_on_one_invoice_are_kept_as_exported_and_never_corrected", "test_sales_import.py::test_invoice_numbers_group_whatever_their_case_and_spacing", "test_sales_import.py::test_a_whole_invoice_listed_twice_is_counted_once_and_noted", "test_sales_import.py::test_an_invoice_level_row_repeated_exactly_is_counted_once_and_a_different_amount_is_a_conflict", "test_sales_import.py::test_two_line_level_invoices_with_one_number_for_different_customers_conflict", "test_sales_import.py::test_quantities_prices_and_totals_of_a_line_level_invoice_are_exact", "test_sales_import.py::test_a_formula_in_a_cell_is_text_and_nothing_is_evaluated", "test_sales_import.py::test_an_excel_file_reads_like_a_csv_file"]


[[case]]
id = "TC-CO-11"
area = "Customer orders"
title = "An upload is planned without changing anything, then kept with its file, rows and period, and never overwrites an accepted invoice"
priority = "High"
kind = "automated"
refs = ["PD-8.3", "DEC-58", "REQ-CO-06", "REQ-CO-07", "NFR-03"]
steps = ["Covered by the tests named."]
expected = "The plan says which invoices are new, the same, changed or conflicting and changes nothing. Keeping an upload stores the file under its hash, every row, the dates it covers (needed, forwards) and a first sighting of each invoice, and audits it. The same file again is refused. A later file with the same invoice only adds a sighting; one that changed keeps its accepted figures, waits for review and keeps the new content beside it. Two invoices with one number are kept for review with both sightings. A credit memo may share a number with an invoice. A failure part way keeps nothing. Trailing zeros and case are not a change."
tests = ["test_sales_import.py::test_the_plan_changes_nothing_and_says_which_invoices_are_new", "test_sales_import.py::test_unknown_customer_names_are_counted_and_known_ones_are_found_exactly", "test_sales_import.py::test_an_upload_keeps_the_file_every_row_the_period_and_a_first_sighting_of_each_invoice", "test_sales_import.py::test_the_same_file_again_is_refused_and_adds_nothing", "test_sales_import.py::test_the_period_is_needed_and_must_run_forwards_and_a_file_with_no_invoice_is_refused", "test_sales_import.py::test_a_later_file_with_the_same_invoice_adds_a_sighting_and_changes_nothing", "test_sales_import.py::test_an_invoice_that_changed_keeps_its_accepted_content_and_waits_for_a_person", "test_sales_import.py::test_two_invoices_with_one_number_are_kept_for_review_with_both_sightings", "test_sales_import.py::test_a_credit_memo_and_an_invoice_may_share_a_number", "test_sales_import.py::test_an_invoice_the_export_marks_for_review_is_kept_for_review", "test_sales_import.py::test_a_failure_part_way_keeps_nothing_once_rolled_back", "test_sales_import.py::test_the_content_compared_is_the_same_from_the_file_and_from_the_database"]


