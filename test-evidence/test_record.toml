t_an_exported_name_the_app_does_not_know_matches_nothing_until_a_person_chooses", "test_reconciliation_scenarios.py::test_scenario_9_a_revision_keeps_the_original_terms_until_approved_and_then_reconciles_the_new_ones", "test_reconciliation_scenarios.py::test_scenario_9_variant_a_persons_line_decision_follows_the_revision_or_is_shown_as_no_longer_fitting", "test_reconciliation_scenarios.py::test_scenario_10_charges_are_apart_from_goods_and_the_net_is_given_when_every_part_is_known", "test_reconciliation_scenarios.py::test_scenario_10_a_credit_memo_never_changes_billed_quantities_and_waits_until_a_person_links_it", "test_reconciliation_scenarios.py::test_scenario_10_variant_a_line_nobody_can_classify_makes_the_net_unknown_and_waits"]

