# The test record of PO Dashboard: every test case, every defect, and the user sign-off list.
#
# This file is the source. After changing it, run `uv run python scripts/test_record.py`: it rewrites TEST_CASES.md,
# DEFECTS.md and SIGN_OFF.md beside it (a test fails if they are out of date), and with `--workbook` it also builds the
# Excel workbook for a test cycle, which stays on this Mac (git-ignored).
#
# Rules (owner, 2026-11-07):
# - IDs are never renumbered or reused. A case that no longer applies is marked retired, not deleted.
# - A failure is recorded the moment it is found, as a [[defect]]: the case, the browser, what was seen, a screenshot,
#   then the cause, the fix and its commit, and a retest with its own screenshot. Earlier failures (before 11/07/2026)
#   are in docs/BUILD_HISTORY.md and are not repeated here.
# - Made-up data only. No real names, prices, addresses or documents: the repository is public.
# - kind: browser = a person does it in Safari and Chrome, and scripts/browser_evidence.py does it in Chrome with a
#   screenshot; terminal = a person does it in Terminal; automated = covered by the pytest tests named; owner = only
#   the owner can do it, with the company's own data, which stays on this Mac.

[meta]
product = "PO Dashboard (RaceSpec Internal Dashboard)"
scope = "Phase 0 and Phase 1: sign-in, people, vendors, purchase orders, imports, the QuickBooks starting load, entries by hand, Home, Open items, Audit, page behaviour, security and speed."
setup = [
    "cd ~/Projects/po-dashboard",
    "export PO_DASHBOARD_DATA=\"$HOME/Projects/po-dashboard-check-data\"   (a throwaway folder; never the real one)",
    "uv run po-dashboard user create-admin boss@example.com   (choose a password, twice; nothing shows as you type)",
    "uv run po-dashboard serve   (leave this window open), then open http://127.0.0.1:8000 and sign in",
    "Made-up files to use, all in tests/data: vendors_sample.xlsx, vendors_problems.csv, purchase_orders_sample.csv, purchase_orders_bad_row.csv, quickbooks_open_pos_110526.csv",
    "Run the cases in the order listed: later cases use what earlier ones created.",
    "Clean up afterwards: Ctrl-C in the server window, then rm -r \"$HOME/Projects/po-dashboard-check-data\" and unset PO_DASHBOARD_DATA",
]

