[project]
name = "po-dashboard"
version = "0.0.1"
description = "A local-first purchasing dashboard: tracks purchase orders from sent to closed by reading vendor email."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "httpx>=0.27",
    "sqlalchemy>=2.1.8",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "python-multipart>=0.0.33",
    "openpyxl>=3.1.5",
    "defusedxml>=0.7.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-openpyxl>=3.1.5.20261017",
]

[project.scripts]
po-dashboard = "po_dashboard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/po_dashboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607", "F811"]  # F811: a fixture imported from another test file
"scripts/**" = ["S603", "S607"]
"evals/**" = ["S310", "E501", "E741", "S110"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
